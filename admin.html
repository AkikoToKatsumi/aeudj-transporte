<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Administracion - AEUDJ</title>
  <link rel="icon" href="img/comite.jpg" type="image/jpg">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body data-page="admin" class="admin-page">
  <main class="container mx-auto px-4 py-8 max-w-6xl">
    <div id="adminPanel" class="hidden">
      <header class="flex justify-between items-center mb-8">
        <div>
          <h1 class="text-3xl font-bold text-white">Administracion</h1>
          <p class="text-gray-400">Control de transporte - <span id="fechaAdmin"></span></p>
        </div>
        <button id="logoutBtn" class="btn-pill-outline">Cerrar sesion</button>
      </header>

      <!-- Stats Grid -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="glass-card p-6 rounded-2xl border border-white/10">
          <div class="text-gray-400 text-sm mb-1">Pasajeros Hoy</div>
          <div id="statTotalPasajeros" class="text-4xl font-bold text-blue-400">--</div>
        </div>
        <div class="glass-card p-6 rounded-2xl border border-white/10">
          <div class="text-gray-400 text-sm mb-1">En Espera</div>
          <div id="statWaitlistTotal" class="text-4xl font-bold text-orange-400">--</div>
        </div>
        <div class="glass-card p-6 rounded-2xl border border-white/10">
          <div class="text-gray-400 text-sm mb-1">Recaudacion</div>
          <div id="statIngresosReales" class="text-4xl font-bold text-green-400">RD$ 0</div>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
        <!-- Lista de Pasajeros -->
        <div class="glass-card p-6 rounded-2xl border border-white/10">
          <h3 class="text-xl font-bold text-white mb-6">Listado por Horarios</h3>
          <div id="adminContainer" class="space-y-4">
             Cargando datos...
          </div>
        </div>

        <!-- Gestion de Staff -->
        <div id="devToolsSection" class="hidden glass-card p-6 rounded-2xl border border-purple-500/30 bg-purple-500/5">
           <h3 class="text-xl font-bold text-purple-400 mb-6">Herramientas de Desarrollador</h3>
           <form id="createStaffForm" class="space-y-4">
             <input type="text" id="staffNombre" placeholder="Nombre completo" class="premium-input w-full" required>
             <input type="text" id="staffMatricula" placeholder="Matricula" class="premium-input w-full" required>
             <input type="password" id="staffPassword" placeholder="Contrasena" class="premium-input w-full" required>
             <select id="staffRol" class="premium-select w-full">
               <option value="estudiante">Estudiante</option>
               <option value="voluntario">Voluntario</option>
               <option value="administrador">Administrador</option>
             </select>
             <button type="submit" class="btn-premium btn-block">Crear Usuario</button>
           </form>
           <div id="staffStatus" class="hidden mt-2 text-center text-sm"></div>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = 'https://irjwxegepkznqrisbrys.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlyand4ZWdlcGt6bnFyaXNicnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNjk0NDIsImV4cCI6MjA5MTc0NTQ0Mn0.TZOhsy0ghfmjK8rd4GWcgbtOLpERKRJ62mjqc5gaYOM';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const currentUser = JSON.parse(localStorage.getItem('aeudj_user') || 'null');
    
    document.addEventListener('DOMContentLoaded', async () => {
      if (!currentUser || (currentUser.rol !== 'administrador' && currentUser.rol !== 'desarrolladora')) {
        window.location.href = 'index.html';
        return;
      }

      document.getElementById('adminPanel').classList.remove('hidden');
      document.getElementById('fechaAdmin').textContent = new Date().toLocaleDateString('es-ES');
      if (currentUser.rol === 'desarrolladora') document.getElementById('devToolsSection')?.classList.remove('hidden');
      if (window.lucide) window.lucide.createIcons();

      loadData();

      async function loadData() {
        const today = new Date().toISOString().split('T')[0];
        const { data: votos, error } = await supabase.from('votos').select('*').eq('fecha', today);
        
        if (error) { console.error(error); return; }

        let total = 0;
        let espera = 0;
        let recaudado = 0;
        
        const container = document.getElementById('adminContainer');
        container.innerHTML = '';

        const listado = {};

        votos.forEach(v => {
          if (!listado[v.horario]) listado[v.horario] = [];
          listado[v.horario].push(v);
          if (v.en_espera) espera++; else total++;
        });

        document.getElementById('statTotalPasajeros').textContent = total;
        document.getElementById('statWaitlistTotal').textContent = espera;

        Object.keys(listado).forEach(h => {
          const card = document.createElement('div');
          card.className = 'p-4 bg-white/5 rounded-xl mb-3';
          card.innerHTML = `<h4 class="font-bold text-blue-400 mb-2">${h}</h4>`;
          listado[h].forEach(p => {
            card.innerHTML += `<div class="text-sm text-gray-300 flex justify-between py-1 border-b border-white/5">
              <span>${p.nombre}</span>
              <span class="text-xs uppercase">${p.en_espera ? 'Espera' : 'OK'}</span>
            </div>`;
          });
          container.appendChild(card);
        });
      }

      document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.clear();
        window.location.href = 'index.html';
      });
      
      // ... Otros eventos similares para crear staff ...
    });
  </script>
</body>
</html>
