<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Administracion - AEUDJ</title>
  <link rel="icon" href="img/comite.jpg" type="image/jpg">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body data-page="admin" class="admin-page">
  <main class="container mx-auto px-4 py-8 max-w-6xl">
    <div id="adminPanel" class="hidden">
      <header class="flex justify-between items-center mb-8">
        <div>
          <h1 class="text-3xl font-bold text-white">Administracion</h1>
          <p class="text-gray-400">Control de transporte - <span id="fechaAdmin"></span></p>
        </div>
        <button id="logoutBtn" class="btn-pill-outline">Cerrar sesion</button>
      </header>

      <!-- Stats Grid -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="bg-[#1e293b]/90 border border-white/5 p-6 rounded-3xl shadow-xl flex items-center justify-between">
          <div>
            <div class="text-gray-400 text-sm mb-1 uppercase tracking-widest font-bold">Total Pasajeros</div>
            <div id="statTotalPasajeros" class="text-4xl font-bold text-blue-400">0</div>
          </div>
          <div class="p-4 bg-blue-500/10 rounded-2xl"><i data-lucide="users" class="text-blue-400 w-8 h-8"></i></div>
        </div>
        <div class="bg-[#1e293b]/90 border border-white/5 p-6 rounded-3xl shadow-xl flex items-center justify-between">
          <div>
            <div class="text-gray-400 text-sm mb-1 uppercase tracking-widest font-bold">En Espera</div>
            <div id="statWaitlistTotal" class="text-4xl font-bold text-orange-400">0</div>
          </div>
          <div class="p-4 bg-orange-500/10 rounded-2xl"><i data-lucide="clock" class="text-orange-400 w-8 h-8"></i></div>
        </div>
        <div class="bg-[#1e293b]/90 border border-white/5 p-6 rounded-3xl shadow-xl flex items-center justify-between">
          <div>
            <div class="text-gray-400 text-sm mb-1 uppercase tracking-widest font-bold">Recaudación Est.</div>
            <div id="statIngresosReales" class="text-4xl font-bold text-green-400">RD$ 0</div>
          </div>
          <div class="p-4 bg-green-500/10 rounded-2xl"><i data-lucide="banknote" class="text-green-400 w-8 h-8"></i></div>
        </div>
      </div>

      <!-- Dashboard Central -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-8">
        <!-- Gráfica de Pasajeros por Horario -->
        <div class="lg:col-span-2 bg-[#1e293b]/90 border border-white/5 p-6 sm:p-8 rounded-3xl shadow-xl relative" style="min-height: 350px;">
          <h3 class="text-xl font-bold text-white mb-6 flex items-center gap-2"><i data-lucide="bar-chart-3" class="text-blue-400 w-5 h-5"></i> Distribución por Horario</h3>
          <div class="w-full h-64">
            <canvas id="horariosChart"></canvas>
          </div>
        </div>

        <!-- Lista Resumida de Horarios -->
        <div class="bg-[#1e293b]/90 border border-white/5 p-6 rounded-3xl shadow-xl flex flex-col">
          <h3 class="text-xl font-bold text-white mb-6 flex items-center gap-2"><i data-lucide="list" class="text-blue-400 w-5 h-5"></i> Resumen de Viajes</h3>
          <div id="adminContainer" class="space-y-3 overflow-y-auto max-h-[300px] pr-2 custom-scroll flex-1">
             <div class="text-gray-500 text-center py-10">Cargando datos...</div>
          </div>
        </div>
      </div>

        <!-- Gestion de Staff -->
        <div id="devToolsSection" class="hidden glass-card p-6 rounded-2xl border border-purple-500/30 bg-purple-500/5">
           <h3 class="text-xl font-bold text-purple-400 mb-6">Herramientas de Desarrollador</h3>
           <form id="createStaffForm" class="space-y-4">
             <input type="text" id="staffNombre" placeholder="Nombre completo" class="premium-input w-full" required>
             <input type="text" id="staffMatricula" placeholder="Matricula" class="premium-input w-full" required>
             <input type="password" id="staffPassword" placeholder="Contrasena" class="premium-input w-full" required>
             <select id="staffRol" class="premium-select w-full">
               <option value="estudiante">Estudiante</option>
               <option value="voluntario">Voluntario</option>
               <option value="administrador">Administrador</option>
             </select>
             <button type="submit" class="btn-premium btn-block">Crear Usuario</button>
           </form>
           <div id="staffStatus" class="hidden mt-2 text-center text-sm"></div>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = 'https://irjwxegepkznqrisbrys.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlyand4ZWdlcGt6bnFyaXNicnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNjk0NDIsImV4cCI6MjA5MTc0NTQ0Mn0.TZOhsy0ghfmjK8rd4GWcgbtOLpERKRJ62mjqc5gaYOM';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const currentUser = JSON.parse(localStorage.getItem('aeudj_user') || 'null');
    
    document.addEventListener('DOMContentLoaded', async () => {
      if (!currentUser || (currentUser.rol !== 'administrador' && currentUser.rol !== 'desarrolladora')) {
        window.location.href = 'index.html';
        return;
      }

      document.getElementById('adminPanel').classList.remove('hidden');
      document.getElementById('fechaAdmin').textContent = new Date().toLocaleDateString('es-ES');
      if (currentUser.rol === 'desarrolladora') document.getElementById('devToolsSection')?.classList.remove('hidden');
      if (window.lucide) window.lucide.createIcons();

      loadData();

      async function loadData() {
        const today = new Date().toISOString().split('T')[0];
        const { data: votos, error } = await supabase.from('votos').select('*').eq('fecha', today).order('horario');
        
        if (error) { console.error(error); return; }

        let total = 0;
        let espera = 0;
        let recaudado = 0;
        
        const container = document.getElementById('adminContainer');
        container.innerHTML = '';

        const listado = {}; // Para el panel lateral
        const chartLabels = [];
        const chartDataConfirmados = [];
        const chartDataEspera = [];

        // Agrupación inicial
        const timeGroups = {};

        votos.forEach(v => {
          if (!listado[v.horario]) listado[v.horario] = [];
          listado[v.horario].push(v);
          
          if (!timeGroups[v.horario]) timeGroups[v.horario] = { confirmados: 0, espera: 0 };
          
          if (v.en_espera) {
             espera++;
             timeGroups[v.horario].espera++;
          } else {
             total++;
             timeGroups[v.horario].confirmados++;
             // Cálculo súper básico de ingresos fijos 200/100 (Dependería de si app.js getPrecio está disponible aquí, usaré un genérico para admin demo)
             const isIda = v.horario.includes('Jarabacoa -> La Vega');
             recaudado += isIda ? 100 : 100; // Asumiendo tarifa plana de 100 por trayecto para simplificar hasta que se exporte getPrecio.
          }
        });

        // Poblar datos del Chart
        Object.keys(timeGroups).forEach(horario => {
           chartLabels.push(horario.split(' ')[0] + ' ' + horario.split(' ')[1]); // Ej: 3:00 PM
           chartDataConfirmados.push(timeGroups[horario].confirmados);
           chartDataEspera.push(timeGroups[horario].espera);
        });

        // Configuración de Chart.js
        const ctx = document.getElementById('horariosChart').getContext('2d');
        if (window.adminChartInstance) window.adminChartInstance.destroy();
        
        window.adminChartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: chartLabels,
                datasets: [
                    {
                        label: 'Confirmados',
                        data: chartDataConfirmados,
                        backgroundColor: '#3b82f6',
                        borderRadius: 6
                    },
                    {
                        label: 'En Espera',
                        data: chartDataEspera,
                        backgroundColor: '#f59e0b',
                        borderRadius: 6
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { stacked: true, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } },
                    y: { stacked: true, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8', stepSize: 1 } }
                },
                plugins: {
                    legend: { labels: { color: '#f8fafc' } }
                }
            }
        });

        document.getElementById('statTotalPasajeros').textContent = total;
        document.getElementById('statWaitlistTotal').textContent = espera;
        document.getElementById('statIngresosReales').textContent = 'RD$ ' + (total * 100).toLocaleString(); // Tarifa base referencial

        if (Object.keys(listado).length === 0) {
           container.innerHTML = '<div class="text-gray-500 text-center py-4">No hay viajes programados hoy.</div>';
           return;
        }

        Object.keys(listado).forEach(h => {
          const confirmados = listado[h].filter(p => !p.en_espera).length;
          const enEspera = listado[h].filter(p => p.en_espera).length;
          
          const card = document.createElement('div');
          card.className = 'p-4 bg-[#0f172a]/60 border border-white/5 rounded-xl flex items-center justify-between mb-3 transition-colors hover:bg-white/5';
          card.innerHTML = `
            <div>
              <h4 class="font-bold text-white text-sm mb-1">${h}</h4>
              <div class="flex gap-2 text-xs">
                <span class="text-blue-400 bg-blue-500/10 px-2 py-0.5 rounded">${confirmados} Confirmados</span>
                ${enEspera > 0 ? `<span class="text-orange-400 bg-orange-500/10 px-2 py-0.5 rounded">${enEspera} Espera</span>` : ''}
              </div>
            </div>
            <div><i data-lucide="chevron-right" class="text-gray-600 w-5 h-5"></i></div>
          `;
          container.appendChild(card);
        });
      }

      document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.clear();
        window.location.href = 'index.html';
      });
      
      // ... Otros eventos similares para crear staff ...
    });
  </script>
</body>
</html>
