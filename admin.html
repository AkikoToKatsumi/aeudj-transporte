<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Panel Comité - AEUDJ</title>
  <link rel="icon" href="img/comite.jpg" type="image/jpg">
  <link rel="stylesheet" href="css/styles.css">
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script type="text/javascript">
    (function() {
        emailjs.init({
          publicKey: "nFSfa8vIE5hozX8Ok",
        });
    })();
  </script>
</head>
<body data-page="admin">
  <!-- ELIMINADO LOG DE ADMIN ANTIGUO; ahora todo pasa por index.html -->

  <!-- PANEL ADMIN -->
  <div id="adminPanel" class="hidden">
    <main class="container mx-auto px-4 py-8 max-w-5xl">
      <div class="page-header">
        <div class="logo">
          <img src="img/comite.jpg" alt="Logo AEUDJ" onerror="this.style.display='none'">
        </div>
        <h1 class="page-title">Panel Comité AEUDJ</h1>
        <p class="page-subtitle">Gestión de pasajeros - <span id="fechaAdmin"></span></p>
      </div>

      <!-- Centro de Notificaciones -->
      <div class="card mb-6" style="background:#f0f9ff; border:1px solid #bae6fd; max-width: 600px; margin: 0 auto 2rem auto;">
        <h2 class="text-xl font-bold text-blue-800 mb-4 text-center">📢 Centro de Notificaciones (Email)</h2>
        <div class="flex flex-wrap gap-3 justify-center">
          <button onclick="notificarAccion('apertura')" class="btn btn-primary" style="background:#3b82f6;">🔔 Avisar Apertura</button>
          <button onclick="notificarAccion('llegada')" class="btn btn-success" style="background:#10b981;">🚌 Avisar Llegada</button>
          <button onclick="notificarAccion('salida')" class="btn btn-warning" style="background:#f59e0b;">💨 Avisar Salida</button>
        </div>
      </div>

      <!-- Crear Nuevo Staff -->
      <div class="card mb-6" style="background:#f0fdf4; border:1px solid #bbf7d0; max-width: 800px; margin: 0 auto 2rem auto;">
        <h2 class="text-xl font-bold text-green-800 mb-4 text-center">➕ Registrar Nuevo Staff/Voluntario</h2>
        <form id="createStaffForm" class="space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <input type="text" id="staffMatricula" class="form-input" placeholder="Matrícula" required>
            <input type="text" id="staffNombre" class="form-input" placeholder="Nombre completo" required>
            <input type="tel" id="staffTelefono" class="form-input" placeholder="Teléfono" required>
            <input type="email" id="staffEmail" class="form-input" placeholder="Correo (opcional)">
            <input type="password" id="staffPassword" class="form-input" placeholder="Contraseña inicial" required>
            <select id="staffRol" class="form-select" required>
              <option value="voluntario">Voluntario</option>
              <option value="administrador">Administrador</option>
              <option value="desarrolladora">Desarrolladora (Super-Admin)</option>
            </select>
          </div>
          <button type="submit" class="btn btn-success btn-block mt-4">Crear Usuario</button>
          <p id="staffStatus" class="text-center text-sm mt-2 hidden"></p>
        </form>
      </div>

      <!-- Gestión de Voluntarios -->
      <div class="card mb-6" style="background:#f8fafc; border:1px solid #e2e8f0; max-width: 800px; margin: 0 auto 2rem auto;">
        <h2 class="text-xl font-bold text-blue-800 mb-4 text-center">👥 Gestión de Voluntarios</h2>
        <div id="voluntariosListContainer" class="mb-4">
           <!-- Aquí se cargarán los usuarios y sus roles -->
           <div class="spinner"></div>
        </div>
      </div>

      <div id="adminContainer">
        <div class="spinner"></div>
      </div>

      <div class="flex flex-col sm:flex-row justify-center items-center gap-4 mt-8">
        <a href="votar.html" class="btn btn-primary">Volver al inicio</a>
        <a href="lista.html" class="btn btn-gray">Ver lista pública</a>
        <a href="no-subieron.html" class="btn btn-danger">Ver quienes no subieron</a>
        <button onclick="logout()" class="btn btn-gray">Cerrar sesión</button>
      </div>
    </main>
  </div>

  <script>
    document.getElementById('fechaAdmin').textContent = new Date().toLocaleDateString('es-ES');
  </script>
  <script type="module" src="js/supabase-config.js"></script>
  <script type="module" src="js/app.js?v=3"></script>
</body>
</html>
