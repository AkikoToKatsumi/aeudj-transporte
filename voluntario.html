<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Voluntario - AEUDJ</title>
  <link rel="icon" href="img/comite.jpg" type="image/jpg">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
  <script src="supabase-config.js"></script>
  <script src="https://unpkg.com/lucide@0.446.0/dist/umd/lucide.min.js" integrity="sha384-5fTWUMSLG5/4ucEwwZpaf9Ew58F5f5D8I3ZoRHaRkEgCYNwW+PQX5QZ0WUmpKpQh" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3.11.0/dist/email.min.js" integrity="sha384-2BNGrQ48jXhJZb0u9FfgOUGJQsbuoecOc1/bdu0oRviV7oc0g5gFTyYsSd7YICDP" crossorigin="anonymous"></script>
  <script src="js/email-init.js"></script>
  <link rel="stylesheet" href="css/voluntario.css">
</head>
<body data-page="voluntario">
  <div id="loading">
    <div class="spinner"></div>
  </div>

  <main>
    <nav class="top-nav">
      <a href="votar.html" class="nav-btn slate">
        <i data-lucide="arrow-left"></i> Volver
      </a>
      <div style="display:flex; gap:0.5rem;">
        <button id="btnHorarios" class="nav-btn purple">
          <i data-lucide="calendar-clock"></i> Horarios
        </button>
        <button id="btnRefresh" class="nav-btn blue">
          <i data-lucide="refresh-cw"></i> Refrescar
        </button>
        <button id="logoutBtn" class="nav-btn red">
          <i data-lucide="log-out"></i> Salir
        </button>
      </div>
    </nav>

    <!-- ===== MODAL: Disponibilidad de Horarios ===== -->
    <div id="modalHorarios" class="vol-modal-overlay hidden">
      <div class="vol-modal-panel">
        <div class="vol-modal-header">
          <div>
            <h2 class="vol-modal-title">📅 Disponibilidad de Horarios</h2>
            <p class="vol-modal-subtitle">Selecciona los horarios que puedes cubrir hoy</p>
          </div>
          <button id="closeModalHorarios" class="vol-modal-close">
            <i data-lucide="x"></i>
          </button>
        </div>

        <!-- Schedule grid -->
        <div id="volHorarioGrid" class="vol-schedule-grid">
          <div class="vol-grid-loading"><div class="spinner" style="width:30px;height:30px;"></div></div>
        </div>

        <div class="vol-modal-footer">
          <p class="vol-modal-hint">
            <i data-lucide="info" style="width:14px;height:14px;"></i>
            Haz clic en un horario para tomar o liberar tu disponibilidad
          </p>
        </div>
      </div>
    </div>

    <header>
      <h1>Panel Voluntario</h1>
      <p class="subtitle">Control de asistencia y pasajeros</p>
      <div class="date-badge" id="currentDate">Lunes, 20 de Mayo</div>
    </header>

    <div class="stats-bar">
      <div class="stat-card glass-card stat-blue">
        <div class="stat-num" id="statTotal">0</div>
        <div class="stat-label">Reservas</div>
      </div>
      <div class="stat-card glass-card stat-green">
        <div class="stat-num" id="statPresentes">0</div>
        <div class="stat-label">Presentes</div>
      </div>
      <div class="stat-card glass-card stat-purple">
        <div class="stat-num" id="statTurnos">0</div>
        <div class="stat-label">Turnos</div>
      </div>
    </div>

    <div class="filter-bar">
      <span class="filter-label">Filtrar:</span>
      <button type="button" class="filter-btn active" data-filter="todos">Todos</button>
      <button type="button" class="filter-btn" data-filter="ida">↗ Ida</button>
      <button type="button" class="filter-btn" data-filter="vuelta">↙ Vuelta</button>
    </div>

    <div id="horariosContainer">
      <!-- Inyectado por JS -->
    </div>

  </main>

  <script type="module" src="js/voluntario_page.js"></script>
</body>
</html>
