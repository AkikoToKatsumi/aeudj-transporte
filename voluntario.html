<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Voluntario - AEUDJ</title>
  <link rel="icon" href="img/comite.jpg" type="image/jpg">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/voluntario.css">
</head>
<body data-page="voluntario">
  <div id="loading">
    <div class="spinner"></div>
  </div>

  <main>
    <nav class="top-nav">
      <a href="votar.html" class="nav-btn slate">
        <i data-lucide="arrow-left"></i> Volver
      </a>
      <div style="display:flex; gap:0.5rem;">
        <button id="btnRefresh" class="nav-btn blue">
          <i data-lucide="refresh-cw"></i> Refrescar
        </button>
        <button id="logoutBtn" class="nav-btn red">
          <i data-lucide="log-out"></i> Salir
        </button>
      </div>
    </nav>

    <header>
      <h1>Panel Voluntario</h1>
      <p class="subtitle">Control de asistencia y pasajeros</p>
      <div class="date-badge" id="currentDate">Lunes, 20 de Mayo</div>
    </header>

    <div class="stats-bar">
      <div class="stat-card glass-card stat-blue">
        <div class="stat-num" id="statTotal">0</div>
        <div class="stat-label">Reservas</div>
      </div>
      <div class="stat-card glass-card stat-green">
        <div class="stat-num" id="statPresentes">0</div>
        <div class="stat-label">Presentes</div>
      </div>
      <div class="stat-card glass-card stat-purple">
        <div class="stat-num" id="statTurnos">0</div>
        <div class="stat-label">Turnos</div>
      </div>
    </div>

    <div class="filter-bar">
      <span class="filter-label">Filtrar:</span>
      <button type="button" class="filter-btn active" data-filter="todos">Todos</button>
      <button type="button" class="filter-btn" data-filter="ida">↗ Ida</button>
      <button type="button" class="filter-btn" data-filter="vuelta">↙ Vuelta</button>
    </div>

    <div id="horariosContainer">
      <!-- Inyectado por JS -->
    </div>

    <div id="emptyMsg" class="empty-state hidden">
      <i data-lucide="clipboard-x"></i>
      <p>No hay pasajeros registrados hoy.</p>
    </div>
  </main>

  <!-- Modal Penalidad -->
  <div id="penalidadModal" class="modal hidden">
    <div class="modal-content">
      <h3 class="modal-title">Registrar Falta</h3>
      <p class="modal-desc">Indica el motivo por el cual el estudiante no asistió al viaje.</p>
      
      <div class="input-group">
        <label class="input-label">Estudiante</label>
        <div id="penName" style="font-weight:700; color:#fff; margin-bottom:1rem; padding:0.5rem; background:rgba(0,0,0,0.2); border-radius:0.5rem;">Nombre del Estudiante</div>
      </div>

      <div class="input-group">
        <label class="input-label">Motivo de la falta</label>
        <input type="text" id="penMotivo" class="input-text" placeholder="Ej: No se presentó a tiempo, avisó tarde, etc.">
      </div>

      <div class="modal-footer">
        <button type="button" id="btnCancelPen" class="btn-ghost">Cancelar</button>
        <button type="button" id="btnConfirmPen" class="btn-primary" style="background:#f43f5e;">Confirmar Falta</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/voluntario_page.js"></script>
</body>
</html>
