<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Voluntario - AEUDJ</title>
  <link rel="icon" href="img/comite.jpg" type="image/jpg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="voluntario">
  <main class="container mx-auto px-4 py-8 max-w-5xl">
    <div class="page-header">
      <div class="logo">
        <img src="img/comite.jpg" alt="Logo AEUDJ" onerror="this.style.display='none'">
      </div>
      <h1 class="page-title">Pase de Lista - Voluntario</h1>
      <p class="page-subtitle">Ruta Actual: <span id="horariosAsignadosText" class="font-bold">Cargando...</span></p>
    </div>

    <div id="voluntarioContainer">
      <!-- Loading spinner -->
      <div class="spinner"></div>
    </div>

    <div class="flex flex-col sm:flex-row justify-center items-center gap-4 mt-8">
      <a href="votar.html" class="btn btn-primary">Volver al inicio</a>
      <a href="lista.html" class="btn btn-gray">Ver lista pública (Todos)</a>
      <button onclick="logout()" class="btn btn-danger">Cerrar sesión</button>
    </div>
  </main>

  <script type="module" src="js/supabase-config.js"></script>
  <script type="module" src="js/app.js?v=8"></script>
</body>
</html>
