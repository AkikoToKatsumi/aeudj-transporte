<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Choferes - AEUDJ</title>
  <link rel="icon" href="img/comite.jpg" type="image/jpg">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
  <script src="supabase-config.js"></script>
  <script src="https://unpkg.com/lucide@0.446.0/dist/umd/lucide.min.js" integrity="sha384-5fTWUMSLG5/4ucEwwZpaf9Ew58F5f5D8I3ZoRHaRkEgCYNwW+PQX5QZ0WUmpKpQh" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3.11.0/dist/email.min.js" integrity="sha384-2BNGrQ48jXhJZb0u9FfgOUGJQsbuoecOc1/bdu0oRviV7oc0g5gFTyYsSd7YICDP" crossorigin="anonymous"></script>
  <script src="js/email-init.js"></script>
  <link rel="stylesheet" href="css/choferes.css">
</head>
<body data-page="choferes">
  <div id="loading">
    <div class="spinner"></div>
  </div>

  <main>
    <nav class="top-nav">
      <a href="votar.html" class="nav-btn" style="color:#94a3b8; border-color:rgba(255,255,255,0.1); background:rgba(255,255,255,0.03);">
        <i data-lucide="arrow-left"></i> Volver
      </a>
      <button id="logoutBtn" class="nav-btn red">
        <i data-lucide="log-out"></i> Cerrar Sesión
      </button>
    </nav>

    <header>
      <h1>Panel de Choferes</h1>
      <p class="subtitle">Gestión de recorridos y pasajeros</p>
      <div class="date-badge" id="currentDate">Cargando fecha...</div>
    </header>

    <div class="stats-bar">
      <div class="stat-card glass-card stat-blue">
        <div class="stat-num" id="stat-total-hoy">0</div>
        <div class="stat-label">Pasajeros Hoy</div>
      </div>
      <div class="stat-card glass-card stat-orange">
        <div class="stat-num" id="stat-turnos-hoy">0</div>
        <div class="stat-label">Viajes Activos</div>
      </div>
    </div>

    <!-- Container para horarios -->
    <div id="horarios-container">
      <!-- Inyectado por JS -->
    </div>

    <div id="no-data-msg" class="no-data hidden">
      <i data-lucide="calendar-x"></i>
      <p>No hay viajes programados para hoy.</p>
    </div>
  </main>

  <!-- Botón flotante para refrescar -->
  <button id="refreshBtn" class="reload-fab" title="Actualizar datos">
    <i data-lucide="refresh-cw"></i>
  </button>

  <script type="module" src="js/choferes_page.js"></script>
</body>
</html>
