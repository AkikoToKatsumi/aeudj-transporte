<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Pasajeros - AEUDJ</title>
  <link rel="icon" href="img/comite.jpg" type="image/jpg">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body data-page="lista" class="lista-page">
  <main class="container mx-auto px-4 py-8 max-w-5xl">
    <header class="text-center mb-10">
      <h1 class="text-4xl font-bold text-white mb-2">Lista de Pasajeros</h1>
      <p class="text-gray-400">Estado del servicio para hoy: <span id="fechaHoy" class="font-bold text-blue-400"></span></p>
    </header>

    <div id="listContainer" class="space-y-8">
       <div class="text-center py-20">
         <div class="spinner mx-auto mb-4"></div>
         <p class="text-gray-400">Cargando listado...</p>
       </div>
    </div>

    <div class="mt-20 text-center">
      <a href="index.html" class="btn-pill-outline">Volver al inicio</a>
    </div>
  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = 'https://irjwxegepkznqrisbrys.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlyand4ZWdlcGt6bnFyaXNicnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNjk0NDIsImV4cCI6MjA5MTc0NTQ0Mn0.TZOhsy0ghfmjK8rd4GWcgbtOLpERKRJ62mjqc5gaYOM';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('fechaHoy').textContent = new Date().toLocaleDateString('es-ES');
      if (window.lucide) window.lucide.createIcons();
      loadData();
    });

    async function loadData() {
      const today = new Date().toISOString().split('T')[0];
      const container = document.getElementById('listContainer');

      try {
        const { data: votos, error } = await supabase.from('votos').select('*').eq('fecha', today).order('horario');
        if (error) throw error;

        container.innerHTML = '';
        if (!votos || votos.length === 0) {
          container.innerHTML = '<div class="glass-card p-10 text-center text-gray-400">No hay pasajeros registrados todavia.</div>';
          return;
        }

        const listado = {};
        votos.forEach(v => {
          if (!listado[v.horario]) listado[v.horario] = [];
          listado[v.horario].push(v);
        });

        Object.keys(listado).forEach(h => {
          const section = document.createElement('section');
          section.className = 'glass-card-wide p-8 rounded-3xl border border-white/10 mb-8';
          
          let html = `
            <div class="flex items-center gap-3 mb-6 border-b border-white/10 pb-4">
              <i data-lucide="clock" class="text-blue-400 w-8 h-8"></i>
              <h2 class="text-3xl font-bold text-white tracking-wide">${h}</h2>
            </div>
          `;
          
          const confirmados = listado[h].filter(p => !p.en_espera);
          const enEspera = listado[h].filter(p => p.en_espera);
          
          if (confirmados.length > 0) {
            html += `<h3 class="text-green-400 font-semibold mb-3 flex items-center gap-2 uppercase tracking-widest text-sm"><i data-lucide="check-circle-2" class="w-4 h-4"></i> Pasajeros Confirmados</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-6">`;
            
            confirmados.forEach((p, idx) => {
              html += `
                <div class="p-4 bg-white/5 border border-white/10 rounded-xl flex flex-col justify-between transition-all hover:bg-white/10 hover:-translate-y-1">
                  <div class="flex justify-between items-start mb-2">
                    <span class="text-white font-medium break-words pr-2">${p.nombre}</span>
                    <span class="text-[10px] text-gray-500 font-bold w-6 h-6 rounded-full bg-white/10 flex items-center justify-center shrink-0">${idx + 1}</span>
                  </div>
                  <div class="flex items-center justify-between mt-2">
                    <span class="text-xs text-blue-300 bg-blue-500/20 px-2 py-1 rounded-md">${p.matricula}</span>
                    <i data-lucide="user" class="text-gray-500 w-4 h-4"></i>
                  </div>
                </div>`;
            });
            html += `</div>`;
          }

          if (enEspera.length > 0) {
            html += `
            <div class="mt-8 border-t border-white/10 pt-6">
              <h3 class="text-orange-400 font-semibold mb-3 flex items-center gap-2 uppercase tracking-widest text-sm"><i data-lucide="clock-4" class="w-4 h-4"></i> Lista de Espera</h3>
              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">`;
              
            enEspera.forEach((p, idx) => {
              html += `
                <div class="p-4 bg-orange-500/10 border border-orange-500/20 rounded-xl flex flex-col justify-between transition-all hover:bg-orange-500/20 hover:-translate-y-1">
                  <div class="flex justify-between items-start mb-2">
                    <span class="text-orange-100 font-medium break-words pr-2 text-opacity-90">${p.nombre}</span>
                    <span class="text-[10px] text-orange-400 font-bold w-6 h-6 rounded-full bg-orange-500/20 flex items-center justify-center shrink-0">${idx + 1}</span>
                  </div>
                  <div class="flex items-center justify-between mt-2">
                    <span class="text-xs text-orange-300 bg-orange-500/20 px-2 py-1 rounded-md">${p.matricula}</span>
                    <i data-lucide="user-x" class="text-orange-400/50 w-4 h-4"></i>
                  </div>
                </div>`;
            });
            html += `</div></div>`;
          }
          
          if (confirmados.length === 0 && enEspera.length === 0) {
             html += `<div class="text-gray-500 text-center py-4">No hay pasajeros en este horario.</div>`;
          }

          section.innerHTML = html;
          container.appendChild(section);
        });

      } catch (err) {
        container.innerHTML = `<div class="text-red-500 text-center font-bold">Error al cargar datos: ${err.message}</div>`;
      }
    }
  </script>
</body>
</html>
