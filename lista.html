<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Pasajeros - AEUDJ</title>
  <link rel="icon" href="img/comite.jpg" type="image/jpg">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/custom-alert.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      background-image: url('img/jarabacoa.webp');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(10, 15, 30, 0.82);
      z-index: 0;
    }
    main {
      position: relative;
      z-index: 1;
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem 1rem 4rem;
    }

    /* Top nav */
    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(59,130,246,0.15);
      border: 1px solid rgba(59,130,246,0.3);
      color: #60a5fa;
      padding: 0.5rem 1rem;
      border-radius: 0.6rem;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-back:hover { background: rgba(59,130,246,0.25); }

    .reload-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.1);
      color: #64748b;
      padding: 0.5rem 1rem;
      border-radius: 0.6rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .reload-btn:hover { border-color: rgba(255,255,255,0.2); color: #94a3b8; }
    .reload-btn svg { width: 14px; height: 14px; }

    header { text-align: center; margin-bottom: 2rem; }
    h1 { font-size: 2rem; font-weight: 800; }
    .date-badge {
      display: inline-block;
      margin-top: 0.5rem;
      background: rgba(59,130,246,0.12);
      border: 1px solid rgba(59,130,246,0.25);
      color: #93c5fd;
      padding: 0.25rem 0.9rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    /* Summary bar */
    .summary-bar {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .summary-pill {
      flex: 1;
      min-width: 120px;
      background: rgba(15,23,42,0.55);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 0.75rem;
      padding: 0.85rem 1rem;
      text-align: center;
      backdrop-filter: blur(16px);
    }
    .summary-pill .pill-num { font-size: 1.6rem; font-weight: 800; color: #60a5fa; }
    .summary-pill .pill-label { font-size: 0.7rem; text-transform: uppercase; color: #475569; font-weight: 700; margin-top: 0.1rem; }

    /* Section card */
    .horario-section {
      background: rgba(15,23,42,0.6);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 1.25rem;
      overflow: hidden;
      margin-bottom: 1.25rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .section-title {
      font-size: 1rem;
      font-weight: 700;
      color: #60a5fa;
    }
    .section-direction {
      font-size: 0.65rem;
      text-transform: uppercase;
      font-weight: 700;
      padding: 0.2rem 0.65rem;
      border-radius: 999px;
    }
    .dir-ida    { background: rgba(59,130,246,0.15); color: #60a5fa; border: 1px solid rgba(59,130,246,0.25); }
    .dir-vuelta { background: rgba(139,92,246,0.15); color: #c4b5fd; border: 1px solid rgba(139,92,246,0.25); }
    .section-count {
      font-size: 0.75rem;
      background: rgba(30,41,59,0.6);
      color: #94a3b8;
      padding: 0.2rem 0.65rem;
      border-radius: 999px;
      font-weight: 600;
    }

    /* Passenger row */
    .passenger-list { padding: 0.75rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .passenger-row {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      background: rgba(30,41,59,0.5);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      transition: background 0.15s;
    }
    .passenger-row:hover { background: rgba(30,41,59,0.8); }
    .passenger-num {
      width: 28px; height: 28px;
      background: rgba(59,130,246,0.2);
      border: 1px solid rgba(59,130,246,0.3);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: #60a5fa;
      flex-shrink: 0;
    }
    .passenger-info { flex: 1; min-width: 0; }
    .passenger-name { font-size: 0.9rem; font-weight: 600; color: #f8fafc; }
    .passenger-uni  { font-size: 0.72rem; color: #475569; margin-top: 0.1rem; }
    .passenger-time {
      font-size: 0.8rem;
      font-weight: 700;
      color: #60a5fa;
      font-family: monospace;
      flex-shrink: 0;
    }
    .badge-espera {
      font-size: 0.6rem;
      font-weight: 700;
      background: rgba(245,158,11,0.15);
      color: #fbbf24;
      border: 1px solid rgba(245,158,11,0.25);
      padding: 0.1rem 0.45rem;
      border-radius: 999px;
      flex-shrink: 0;
    }

    /* Empty / loading */
    .empty-state {
      text-align: center;
      padding: 3rem 1.5rem;
      color: #475569;
    }
    .empty-state svg { width: 48px; height: 48px; margin: 0 auto 1rem; opacity: 0.3; }
    .empty-state p { font-size: 0.9rem; }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(59,130,246,0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .spin-animation { animation: spin 0.8s linear infinite; }



    @media (max-width: 500px) {
      .summary-bar { gap: 0.5rem; }
      .summary-pill { min-width: 90px; }
    }
  </style>
</head>
<body>
  <main>

    <nav class="top-nav">
      <a href="votar.html" class="btn-back">
        <i data-lucide="arrow-left" style="width:14px;height:14px;"></i> Volver
      </a>
      <button class="reload-btn" id="reloadBtn">
        <i data-lucide="refresh-cw"></i> Actualizar
      </button>
    </nav>

    <header>
      <h1>📋 Lista de Pasajeros</h1>
      <div class="date-badge" id="fechaBadge">Cargando...</div>
      <div style="margin-top:0.5rem;display:inline-flex;align-items:center;gap:0.35rem;font-size:0.72rem;color:#34d399;font-weight:600;">
        <span style="width:7px;height:7px;background:#34d399;border-radius:50%;display:inline-block;animation:pulse 2s infinite;"></span>
        Actualizando en tiempo real
      </div>
    </header>

    <!-- Stats -->
    <div class="summary-bar" id="summaryBar" style="display:none;">
      <div class="summary-pill">
        <div class="pill-num" id="statTotal">0</div>
        <div class="pill-label">Pasajeros</div>
      </div>
      <div class="summary-pill">
        <div class="pill-num" id="statIda">0</div>
        <div class="pill-label">Viajes Ida</div>
      </div>
      <div class="summary-pill">
        <div class="pill-num" id="statVuelta">0</div>
        <div class="pill-label">Viajes Vuelta</div>
      </div>
    </div>

    <!-- List container -->
    <div id="listContainer">
      <div class="empty-state">
        <div class="spinner"></div>
        <p style="margin-top:1rem;">Cargando lista...</p>
      </div>
    </div>



  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
    const SUPABASE_URL = 'https://irjwxegepkznqrisbrys.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlyand4ZWdlcGt6bnFyaXNicnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNjk0NDIsImV4cCI6MjA5MTc0NTQ0Mn0.TZOhsy0ghfmjK8rd4GWcgbtOLpERKRJ62mjqc5gaYOM';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const SCHEDULES_IDA = ['Jarabacoa -> La Vega','Jarabacoa → La Vega'];

    function isIda(horario) {
      return SCHEDULES_IDA.some(s => horario.includes(s));
    }

    function getCycleDate() {
      const now = new Date();
      const hora = now.getHours();
      let targetDate = now;
      if (hora >= 22) {
        targetDate = new Date(now);
        targetDate.setDate(targetDate.getDate() + 1);
      }
      const y = targetDate.getFullYear();
      const m = String(targetDate.getMonth() + 1).padStart(2, '0');
      const d = String(targetDate.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatDate(d) {
      const [y,m,day] = d.split('-');
      const months = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
      return `${parseInt(day)} de ${months[parseInt(m)-1]} de ${y}`;
    }

    async function loadData() {
      const cycleDate = getCycleDate();
      document.getElementById('fechaBadge').textContent = formatDate(cycleDate);
      const container = document.getElementById('listContainer');

      try {
        let { data: votos, error } = await supabase
          .from('votos').select('*')
          .eq('fecha', cycleDate)
          .gt('id', 40)
          .order('horario', { ascending: true })
          .order('created_at', { ascending: true });

        if (error) throw error;
        
        // Filtrar pasajeros que ya fueron pasados en la lista (se_monto !== null)
        votos = votos.filter(v => v.se_monto === null);

        container.innerHTML = '';

        if (!votos || votos.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <i data-lucide="check-circle" style="display:block; color:#34d399; margin: 0 auto 1rem; width: 48px; height: 48px;"></i>
              <p>No hay listas pendientes o todas las listas de hoy ya fueron pasadas. ¡Buen viaje!</p>
            </div>`;
          if (window.lucide) window.lucide.createIcons();
          return;
        }

        // Stats
        const totalUniq = new Set(votos.map(v=>v.usuario_id)).size;
        const idaCount  = votos.filter(v=>isIda(v.horario)).length;
        const vueltaCount = votos.length - idaCount;
        document.getElementById('statTotal').textContent  = totalUniq;
        document.getElementById('statIda').textContent    = idaCount;
        document.getElementById('statVuelta').textContent = vueltaCount;
        document.getElementById('summaryBar').style.display = 'flex';



        // Group by horario
        const groups = {};
        votos.forEach(v => {
          if (!groups[v.horario]) groups[v.horario] = [];
          groups[v.horario].push(v);
        });

        Object.entries(groups).forEach(([horario, pasajeros]) => {
          const ida = isIda(horario);
          const section = document.createElement('div');
          section.className = 'horario-section';
          section.innerHTML = `
            <div class="section-header">
              <div>
                <div class="section-title">${horario}</div>
              </div>
              <div style="display:flex;gap:0.5rem;align-items:center;">
                <span class="section-direction ${ida ? 'dir-ida' : 'dir-vuelta'}">${ida ? '↗ Ida' : '↙ Vuelta'}</span>
                <span class="section-count">${pasajeros.length} persona${pasajeros.length !== 1 ? 's' : ''}</span>
              </div>
            </div>
            <div class="passenger-list" id="list-${encodeURIComponent(horario)}"></div>
          `;
          container.appendChild(section);

          const listEl = section.querySelector('.passenger-list');
          pasajeros.forEach((p, idx) => {
            const t = new Date(p.created_at);
            let hours = t.getHours();
            const minutes = t.getMinutes().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            const time = `${hours}:${minutes} ${ampm}`;
            const row = document.createElement('div');
            row.className = 'passenger-row';
            const esperaBadge = p.punto_espera === 'camino'
              ? '<span style="font-size:0.6rem;font-weight:800;background:rgba(52,211,153,0.12);color:#34d399;border:1px solid rgba(52,211,153,0.3);padding:0.12rem 0.5rem;border-radius:999px;flex-shrink:0;">🚶 Camino</span>'
              : p.punto_espera === 'parada'
              ? '<span style="font-size:0.6rem;font-weight:800;background:rgba(59,130,246,0.12);color:#93c5fd;border:1px solid rgba(59,130,246,0.3);padding:0.12rem 0.5rem;border-radius:999px;flex-shrink:0;">📍 Parada</span>'
              : '';
            row.innerHTML = `
              <div class="passenger-num">${idx + 1}</div>
              <div class="passenger-info">
                <div style="display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap;">
                  <div class="passenger-name">${p.nombre || 'Sin nombre'}</div>
                  ${p.en_espera ? '<span class="badge-espera">En espera</span>' : ''}
                  ${esperaBadge}
                </div>
                ${p.universidad ? `<div class="passenger-uni">${p.universidad}</div>` : ''}
              </div>
              <div class="passenger-time">${time}</div>
            `;
            listEl.appendChild(row);
          });
        });

        if (window.lucide) window.lucide.createIcons();

      } catch(err) {
        container.innerHTML = `<div class="empty-state"><p style="color:#f87171;">Error al cargar: ${err.message}</p></div>`;
      }
    }

    document.getElementById('reloadBtn').onclick = async (e) => {
      const btn = e.currentTarget;
      const icon = btn.querySelector('svg');
      if(icon) icon.classList.add('spin-animation');
      
      const container = document.getElementById('listContainer');
      container.innerHTML = `<div class="empty-state"><div class="spinner"></div><p style="margin-top:1rem;">Actualizando...</p></div>`;
      
      await loadData();
      
      if(icon) icon.classList.remove('spin-animation');
    };
    if (window.lucide) window.lucide.createIcons();
    loadData();

    // ── TIEMPO REAL ─────────────────────────────────────
    const cycleDate = (() => {
      const now = new Date();
      const hora = now.getHours();
      let targetDate = now;
      if (hora >= 22) {
        targetDate = new Date(now);
        targetDate.setDate(targetDate.getDate() + 1);
      }
      const y = targetDate.getFullYear();
      const m = String(targetDate.getMonth() + 1).padStart(2, '0');
      const d = String(targetDate.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    })();

    supabase
      .channel('votos-lista')
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'votos', filter: `fecha=eq.${cycleDate}` },
        () => { loadData(); }
      )
      .subscribe();
  </script>
</body>
</html>
