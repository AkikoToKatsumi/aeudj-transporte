<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Pasajeros - AEUDJ</title>
  <link rel="icon" href="img/comite.jpg" type="image/jpg">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
  <script src="supabase-config.js"></script>
  <script src="https://unpkg.com/lucide@0.446.0/dist/umd/lucide.min.js" integrity="sha384-5fTWUMSLG5/4ucEwwZpaf9Ew58F5f5D8I3ZoRHaRkEgCYNwW+PQX5QZ0WUmpKpQh" crossorigin="anonymous"></script>
  <script src="js/custom-alert.js"></script>
  <link rel="stylesheet" href="css/lista.css">
</head>
<body data-page="lista">
  <a href="votar.html" class="btn-nav">
    <i data-lucide="arrow-left" style="width:16px;height:16px;"></i> Volver
  </a>

  <main>
    <header>
      <h1>Lista de Pasajeros</h1>
      <p class="subtitle">Sincronización en tiempo real de viajes</p>
      <div class="date-badge" id="fechaBadge">Cargando fecha...</div>
    </header>

    <div class="summary-bar" id="summaryBar" style="display:none;">
      <div class="summary-item">
        <div class="summary-num" id="statTotal">0</div>
        <div class="summary-lbl">Total Uniq</div>
      </div>
      <div class="summary-item">
        <div class="summary-num" id="statIda" style="color:#60a5fa;">0</div>
        <div class="summary-lbl">↗ Ida</div>
      </div>
      <div class="summary-item">
        <div class="summary-num" id="statVuelta" style="color:#c4b5fd;">0</div>
        <div class="summary-lbl">↙ Vuelta</div>
      </div>
    </div>

    <div id="listContainer">
      <div class="empty-state">
        <div class="spinner"></div>
        <p>Sincronizando con la base de datos...</p>
      </div>
    </div>
  </main>

  <button class="reload-fab" id="reloadBtn">
    <i data-lucide="refresh-cw"></i>
  </button>

  <script type="module" src="js/lista_page.js"></script>
</body>
</html>
