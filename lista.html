<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Pasajeros - AEUDJ</title>
  <link rel="icon" href="img/comite.jpg" type="image/jpg">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body data-page="lista" class="lista-page">
  <main class="container mx-auto px-4 py-8 max-w-5xl">
    <header class="text-center mb-10">
      <h1 class="text-4xl font-bold text-white mb-2">Lista de Pasajeros</h1>
      <p class="text-gray-400">Estado del servicio para hoy: <span id="fechaHoy" class="font-bold text-blue-400"></span></p>
    </header>

    <div id="listContainer" class="space-y-8">
       <div class="text-center py-20">
         <div class="spinner mx-auto mb-4"></div>
         <p class="text-gray-400">Cargando listado...</p>
       </div>
    </div>

    <div class="mt-20 text-center">
      <a href="index.html" class="btn-pill-outline">Volver al inicio</a>
    </div>
  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = 'https://irjwxegepkznqrisbrys.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlyand4ZWdlcGt6bnFyaXNicnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNjk0NDIsImV4cCI6MjA5MTc0NTQ0Mn0.TZOhsy0ghfmjK8rd4GWcgbtOLpERKRJ62mjqc5gaYOM';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('fechaHoy').textContent = new Date().toLocaleDateString('es-ES');
      if (window.lucide) window.lucide.createIcons();
      loadData();
    });

    async function loadData() {
      const today = new Date().toISOString().split('T')[0];
      const container = document.getElementById('listContainer');

      try {
        const { data: votos, error } = await supabase.from('votos').select('*').eq('fecha', today).order('horario');
        if (error) throw error;

        container.innerHTML = '';
        if (!votos || votos.length === 0) {
          container.innerHTML = '<div class="glass-card p-10 text-center text-gray-400">No hay pasajeros registrados todavia.</div>';
          return;
        }

        const listado = {};
        votos.forEach(v => {
          if (!listado[v.horario]) listado[v.horario] = [];
          listado[v.horario].push(v);
        });

        Object.keys(listado).forEach(h => {
          const section = document.createElement('section');
          section.className = 'glass-card p-6 rounded-2xl border border-white/10';
          let html = `<h2 class="text-2xl font-bold text-blue-400 mb-4 border-b border-white/10 pb-2">${h}</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">`;
          
          listado[h].forEach(p => {
            html += `<div class="p-3 bg-white/5 rounded-lg flex justify-between items-center">
              <span class="text-white">${p.nombre}</span>
              <span class="text-xs ${p.en_espera ? 'text-orange-400' : 'text-green-400'} uppercase font-bold">
                ${p.en_espera ? 'Lista Espera' : 'Confirmado'}
              </span>
            </div>`;
          });
          
          html += `</div>`;
          section.innerHTML = html;
          container.appendChild(section);
        });

      } catch (err) {
        container.innerHTML = `<div class="text-red-500 text-center font-bold">Error al cargar datos: ${err.message}</div>`;
      }
    }
  </script>
</body>
</html>
