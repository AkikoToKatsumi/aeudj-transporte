<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Pasajeros - AEUDJ</title>
  <link rel="icon" href="img/comite.jpg" type="image/jpg">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body data-page="lista" class="lista-page">
  <main class="w-full mx-auto px-4 py-8 relative" style="max-width: 56rem;">
    
    <!-- Top Left Home Button -->
    <a href="index.html" class="absolute top-8 left-4 px-4 py-2 font-bold transition-colors flex items-center gap-2 z-10 text-sm" style="background-color: #3b82f6; color: white; border-radius: 0.5rem; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);">
      <span>🏠</span> Volver al inicio
    </a>

    <header class="text-center mb-10 pt-16">
      <h1 class="text-4xl font-bold text-white mb-3 flex items-center justify-center gap-3">
        <span>📋</span> Lista de Pasajeros
      </h1>
      <p class="text-gray-400 font-medium">Organizada por horario - <span id="fechaHoy"></span></p>
    </header>

    <div id="listContainer" class="space-y-6">
       <div class="text-center py-20">
         <div class="spinner mx-auto mb-4"></div>
         <p class="text-gray-400 font-medium">Cargando listado...</p>
       </div>
    </div>

    <!-- Cambios Section (Hidden by default, shown if logged in) -->
    <div id="cambiosSection" class="hidden mt-8">
      <div style="background-color: rgba(30, 41, 59, 0.9); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 1rem; padding: 1.5rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);">
        <h3 class="text-white text-center font-bold text-lg mb-4">¿Cambios?</h3>
        <div class="flex flex-col sm:flex-row items-center justify-center gap-3" style="flex-wrap: wrap;">
          <a href="cambios.html?action=antes" class="px-6 py-2 transition-all shadow-lg font-bold text-center" style="background-color: #f59e0b; color: white; border-radius: 0.75rem; font-size: 0.875rem;">Me fui antes</a>
          <a href="cambios.html?action=despues" class="px-6 py-2 transition-all shadow-lg font-bold text-center" style="background-color: #3b82f6; color: white; border-radius: 0.75rem; font-size: 0.875rem;">Me iré después</a>
          <a href="cambios.html?action=otros" class="px-6 py-2 transition-all shadow-lg font-bold text-center" style="background-color: #334155; color: white; border-radius: 0.75rem; font-size: 0.875rem;">Voy por otros medios</a>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = 'https://irjwxegepkznqrisbrys.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlyand4ZWdlcGt6bnFyaXNicnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNjk0NDIsImV4cCI6MjA5MTc0NTQ0Mn0.TZOhsy0ghfmjK8rd4GWcgbtOLpERKRJ62mjqc5gaYOM';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('fechaHoy').textContent = new Date().toLocaleDateString('es-ES');
      if (window.lucide) window.lucide.createIcons();
      loadData();
    });

    async function loadData() {
      const today = new Date().toISOString().split('T')[0];
      const container = document.getElementById('listContainer');

      try {
        const { data: votos, error } = await supabase.from('votos').select('*').eq('fecha', today).gt('id', 40).order('horario');
        if (error) throw error;

        container.innerHTML = '';
        if (!votos || votos.length === 0) {
          container.innerHTML = '<div style="background-color: rgba(30, 41, 59, 0.8); padding: 2.5rem; border-radius: 1rem; text-align: center; color: #94a3b8; border: 1px solid rgba(255,255,255,0.05);">No hay pasajeros registrados todavía.</div>';
          return;
        }

        const currentUser = JSON.parse(localStorage.getItem('aeudj_user') || 'null');
        if(currentUser) {
          document.getElementById('cambiosSection').classList.remove('hidden');
        }

        const listado = {};
        votos.forEach(v => {
          if (!listado[v.horario]) listado[v.horario] = [];
          listado[v.horario].push(v);
        });

        Object.keys(listado).forEach(h => {
          const section = document.createElement('section');
          section.style = 'background-color: rgba(30, 41, 59, 0.95); padding: 2rem; border-radius: 1.5rem; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 2rem;';
          
          let html = `
            <div class="text-center mb-6">
              <h2 class="font-bold tracking-wide" style="color: #60a5fa; font-size: 1.5rem;">${h}</h2>
            </div>
            <div class="space-y-3">
          `;
          
          // Render All
          listado[h].forEach((p, idx) => {
             const timeObj = new Date(p.created_at);
             const formattedTime = timeObj.getHours().toString().padStart(2, '0') + ':' + timeObj.getMinutes().toString().padStart(2, '0');
             const univText = p.universidad ? `<span class="text-gray-400 font-semibold">(${p.universidad})</span>` : '';
             
             html += `
                <div class="flex items-center justify-between transition-colors" style="background-color: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.05); border-radius: 1rem; padding: 1rem; margin-bottom: 0.75rem;">
                  <div class="flex items-center gap-4">
                    <div class="font-bold flex items-center justify-center shrink-0" style="background-color: #3b82f6; color: white; width: 2rem; height: 2rem; border-radius: 50%; font-size: 0.875rem;">
                      ${idx + 1}
                    </div>
                    <div class="text-white font-bold" style="font-size: 0.95rem;">
                      ${p.nombre} ${univText}
                    </div>
                  </div>
                  <div class="font-bold text-blue-400" style="font-size: 0.9rem; margin-left: auto;">
                    ${formattedTime}
                  </div>
                </div>
             `;
          });

          html += `</div>`;
          section.innerHTML = html;
          container.appendChild(section);
        });

      } catch (err) {
        container.innerHTML = `<div class="text-red-500 text-center font-bold">Error al cargar datos: ${err.message}</div>`;
      }
    }
  </script>
</body>
</html>
