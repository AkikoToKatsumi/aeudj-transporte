<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Selector de Horarios - AEUDJ</title>
  <link rel="icon" href="img/comite.jpg" type="image/jpg">
  <link rel="stylesheet" href="css/styles.css?v=318">

  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body data-page="votar" class="votar-page">
  <main class="container mx-auto px-4 py-8 max-w-5xl">
    <div id="staffMenu" class="hidden text-center mb-6"></div>

    <header class="text-center mb-8">
      <h1 class="text-4xl font-bold text-white mb-2">Selector de Horarios</h1>
      <p class="text-lg text-gray-300">Selecciona <strong>un viaje de ida</strong> y <strong>un viaje de vuelta</strong></p>
    </header>

    <form id="horarioForm" class="glass-card-wide card mb-6 p-6 hidden">

      <div style="background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; text-align: center; padding: 1.5rem; border-radius: 1rem; margin-bottom: 2rem; box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);">
        <i data-lucide="calendar" class="mx-auto mb-2 w-8 h-8"></i>
        <div class="font-bold text-xl">Horarios de Hoy</div>
      </div>

      <div id="scheduleGrid" class="schedule-grid">
        <!-- Cargando dinámicamente -->
        <div class="text-center w-full py-10 text-gray-400">
           Cargando horarios...
        </div>
      </div>

      <div class="text-center mt-10">
        <button type="submit" id="submitBtn" class="btn-premium btn-block py-4 text-xl">
          Confirmar Seleccion
        </button>
      </div>

      <div id="status-message" class="text-center text-sm font-medium mt-4 text-blue-400"></div>
    </form>

    <!-- VISTA CONFIRMADA (SUMMARY & ACTIONS) -->
    <div id="confirmedView" class="glass-card-wide card mb-6 p-8 hidden animate-fade-in">
      <div class="text-center mb-8">
        <div class="confirm-badge mx-auto mb-4">
          <i data-lucide="check-circle" class="w-12 h-12 text-green-400"></i>
        </div>
        <h2 class="text-3xl font-bold text-white mb-2">Voto Confirmado</h2>
        <p class="text-gray-400">Ya has reservado tus horarios para el ciclo actual.</p>
      </div>

      <div class="confirmed-schedules-list space-y-4 mb-10">
        <!-- Renderizado dinámico -->
      </div>

      <div class="notification-actions space-y-4">
        <p class="text-sm font-semibold text-gray-500 uppercase tracking-widest text-center mb-4">Notificaciones y Cambios</p>
        <div class="confirmed-actions grid grid-cols-2 gap-3">
          <button id="btnMeFuiAntes" class="btn-action bg-emerald-500/10 text-emerald-400 border-emerald-500/20">
            <i data-lucide="check-circle" class="w-5 h-5"></i>
            <span>Me fui antes</span>
          </button>
          <button id="btnIreDespues" class="btn-action bg-blue-500/10 text-blue-400 border-blue-500/20">
            <i data-lucide="clock" class="w-5 h-5"></i>
            <span>Iré después</span>
          </button>
          <button id="btnOtrosMedios" class="btn-action bg-rose-500/10 text-rose-400 border-rose-500/20">
            <i data-lucide="car" class="w-5 h-5"></i>
            <span>Otros medios</span>
          </button>
          <button id="btnCambiarHorario" class="btn-action bg-slate-500/10 text-slate-400 border-slate-500/20">
            <i data-lucide="edit-3" class="w-5 h-5"></i>
            <span>Nuevo Plan</span>
          </button>
        </div>
      </div>
    </div>

    <div class="text-center mt-12">
      <button id="logoutBtn" class="btn-pill-outline">Cerrar sesion</button>

    </div>
  </main>

  <!-- LOGICA UNIFICADA -->
  <script type="module" src="app.js?v=318"></script>
</body>
</html>
