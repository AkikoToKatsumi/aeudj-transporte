<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Selector de Horarios - AEUDJ</title>
  <link rel="icon" href="img/comite.jpg" type="image/jpg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="votar">
  <main class="container mx-auto px-4 py-8 max-w-5xl">
    <header class="text-center mb-8">
      <h1 class="text-4xl font-bold text-gray-800 mb-2">Selector de Horarios</h1>
      <p class="text-lg text-gray-600">Selecciona <strong>un viaje de ida</strong> y <strong>un viaje de vuelta</strong></p>
    </header>

    <div id="staffMenu" class="hidden text-center mb-6"></div>
    <form id="horarioForm" class="card mb-6">
      <div style="background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; text-align: center; padding: 1rem; border-radius: 0.75rem; margin-bottom: 1.5rem;">
        <div class="text-2xl mb-1">📅</div>
        <div class="font-bold text-lg">Horarios de Hoy</div>
      </div>

      <div id="scheduleGrid" class="schedule-grid">
        <!-- Horarios se cargan dinámicamente -->
      </div>

      <div class="text-center mt-6">
        <button type="submit" class="btn btn-purple" style="font-size: 1.125rem; padding: 0.75rem 2rem;">
          Confirmar Selección
        </button>
      </div>

      <div id="status-message" class="text-center text-sm font-medium mt-4"></div>
    </form>

    <div class="text-center">
      <button onclick="logout()" class="btn btn-gray">Cerrar sesión</button>
    </div>
  </main>

  <script type="module" src="js/supabase-config.js"></script>
  <script type="module" src="js/app.js?v=11"></script>
</body>
</html>
