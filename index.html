<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AEUDJ - Registro / Inicio</title>
  <link rel="icon" href="img/comite.jpg" type="image/jpg">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/custom-alert.js"></script>
</head>

<body data-page="index">
  <main class="login-container">
    <div class="card glass-card">
      <div class="mockup-logo">
        <img src="img/comite.jpg" alt="Logo AEUDJ">
      </div>

      <div class="text-center mb-8 pt-4">
        <h1 class="text-3xl font-bold text-white mb-2">AEUDJ Transporte</h1>
        <p class="text-gray-300">Accede a tu cuenta</p>
      </div>

      <div id="errorMsg" class="alert alert-error hidden"></div>

      <!-- INICIO DE SESION -->
      <form id="loginForm" class="space-y-5">
        <h3 class="text-lg font-semibold text-white">Iniciar sesión</h3>

        <div class="input-wrapper">
          <i data-lucide="smartphone" class="input-icon"></i>
          <input type="text" id="userInput" class="premium-input" placeholder="Teléfono o matrícula" required>
        </div>

        <div class="input-wrapper">
          <i data-lucide="lock" class="input-icon"></i>
          <input type="password" id="passwordLogin" class="premium-input" placeholder="Contraseña" required>
          <button type="button" id="togglePasswordLogin" class="toggle-password">
            <i data-lucide="eye"></i>
          </button>
        </div>

        <button type="submit" id="submitLogin" class="btn-premium btn-block">
          Entrar
          <i data-lucide="arrow-right" class="btn-arrow"></i>
        </button>

        <div class="text-center mt-6">
          <p class="text-gray-400 text-sm">
            ¿No tienes una cuenta?
            <a href="#" id="showRegisterBtn" class="text-blue-400 font-bold hover:underline">Regístrate</a>
          </p>
        </div>

        <div class="divider mt-8"></div>

        <a href="lista.html" class="btn-pill-outline btn-block mt-6">
          <i data-lucide="eye" class="icon-left"></i>
          Ver lista pública de pasajeros
          <i data-lucide="chevron-right" class="icon-right"></i>
        </a>
      </form>

      <!-- REGISTRO -->
      <form id="registerForm" class="space-y-4 hidden">
        <h3 class="text-lg font-semibold text-white mb-2">Crear nueva cuenta</h3>
        <div class="input-wrapper">
          <i data-lucide="user" class="input-icon"></i>
          <input type="text" id="nombre" class="premium-input" placeholder="Nombre completo" required>
        </div>
        <div class="input-wrapper">
          <i data-lucide="hash" class="input-icon"></i>
          <input type="text" id="matricula" class="premium-input" placeholder="Matrícula" required>
        </div>
        <div class="input-wrapper">
          <i data-lucide="phone" class="input-icon"></i>
          <input type="tel" id="telefono" class="premium-input" placeholder="Teléfono" required>
        </div>
        <div class="input-wrapper">
          <i data-lucide="mail" class="input-icon"></i>
          <input type="email" id="email" class="premium-input" placeholder="Correo electrónico" required>
        </div>
        <div class="input-wrapper">
          <i data-lucide="lock" class="input-icon"></i>
          <input type="password" id="password" class="premium-input" placeholder="Contraseña" required>
          <button type="button" id="togglePasswordReg" class="toggle-password">
            <i data-lucide="eye"></i>
          </button>
        </div>
        <div class="input-wrapper">
          <i data-lucide="school" class="input-icon"></i>
          <select id="universidad" class="premium-select" required>
            <option value="">-- Universidad --</option>
            <option value="UCATECI">UCATECI</option>
            <option value="UAFAM">UNPHU</option>
            <option value="UAPA">UAPA</option>
            <option value="Otra">UASD</option>
          </select>
        </div>
        <button type="submit" class="btn-premium btn-success btn-block">Registrar cuenta</button>
        <div class="text-center mt-4">
          <a href="#" id="showLoginBtn" class="text-blue-400 font-medium hover:underline">¿Ya tienes cuenta? Inicia
            sesión</a>
        </div>
      </form>
    </div>

    <footer class="login-footer">
      <p style="font-size: 10px; color: rgba(255,255,255,0.2);">ULTIMATE EMERGENCY RESCUE v2.0</p>
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=407"></script>
  <script src="app.js?v=407"></script>
</body>

</html>
